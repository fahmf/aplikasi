<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1400"/>
<title>Quizz · Hi-Fi</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="hifi-core.jsx"></script>
<script type="text/babel" src="hifi-screens.jsx"></script>

<script type="text/babel">
function App() {
  const phone = (Screen) => (
    <AndroidDevice width={340} height={720}><Screen/></AndroidDevice>
  );
  return (
    <DesignCanvas>
      <DCSection id="flow" title="Quizz · Hi-Fi Flow" subtitle="Emerald + gold · Islamic geometric · Cairo & Amiri">
        <DCArtboard id="pick" label="١ · Pilih Pelajaran" width={360} height={740}>{phone(HFPickLesson)}</DCArtboard>
        <DCArtboard id="dash" label="٢ · Dashboard (Path)" width={360} height={740}>{phone(HFDashboardPath)}</DCArtboard>
        <DCArtboard id="intro" label="٣ · Intro Wahdah" width={360} height={740}>{phone(HFIntroUnit)}</DCArtboard>
        <DCArtboard id="quiz" label="٤ · Soal MCQ" width={360} height={740}>{phone(HFQuizMCQ)}</DCArtboard>
        <DCArtboard id="result" label="٥ · Hasil" width={360} height={740}>{phone(HFResult)}</DCArtboard>
        <DCArtboard id="lb" label="٦ · Leaderboard" width={360} height={740}>{phone(HFLeaderboard)}</DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
